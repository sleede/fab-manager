services:
  postgres:
    image: postgres:18.6-bookworm@sha256:5c4783a8cc3f0074912164f94dfa1be4e043438f0f707cf968d7af9a0d31a2c8
    entrypoint: [bash, /run/postgresql-entrypoint.sh]
    command: [postgres, -c, ssl=on, -c, ssl_cert_file=/certs/server.crt, -c, ssl_key_file=/certs/server.key]
    volumes:
      - type: bind
        source: ${PWD}/postgresql
        target: /var/lib/postgresql
        bind:
          create_host_path: false
      - ${PWD}/config/postgresql-entrypoint.sh:/run/postgresql-entrypoint.sh:ro
      - ${PWD}/config/postgresql-guard:/run/fm-pg-guard
      - ${PWD}/config/postgresql-certificates/postgres:/certs:ro
      - ${PWD}/config/postgresql-password:/run/secrets/postgresql-password:ro
    restart: always
    ## linux
    networks:
      fabmanager:
         ipv4_address: 172.18.0.2
    ## osx
    #ports:
    #  - "5432:5432"
    environment:
      PGDATA: /var/lib/postgresql/18/docker
      POSTGRES_PASSWORD_FILE: /run/secrets/postgresql-password
      POSTGRES_INITDB_ARGS: --auth-host=scram-sha-256 --auth-local=scram-sha-256
      FM_PG_INITIALIZE: ${FM_PG_INITIALIZE:-0}

  elasticsearch:
    image: elasticsearch:5.6
    environment:
      - "ES_JAVA_OPTS=-Xms512m -Xmx512m -Dlog4j2.formatMsgNoLookups=true"
    ulimits:
      memlock:
        soft: -1
        hard: -1
    volumes:
      - ${PWD}/elasticsearch/config:/usr/share/elasticsearch/config
      - ${PWD}/elasticsearch:/usr/share/elasticsearch/data
      - ${PWD}/elasticsearch/plugins:/usr/share/elasticsearch/plugins
      - ${PWD}/elasticsearch/backups:/usr/share/elasticsearch/backups
    restart: always
    ## linux
    networks:
      fabmanager:
        ipv4_address: 172.18.0.3
    ## osx
    #ports:
    #  - "9200:9200"
    #  - "9300:9300"

  kibana:
    image: kibana:5.6
    environment:
      ELASTICSEARCH_HOSTS: http://fabmanager-elastic:9200
    restart: always
    ## linux
    networks:
      fabmanager:
        ipv4_address: 172.18.0.5
    ## osx
    #ports:
    #  - "5601:5601"

  redis:
    image: redis:6-alpine
    volumes:
      - ${PWD}/redis:/data
    restart: always
    ## linux
    networks:
      fabmanager:
        ipv4_address: 172.18.0.4
    ## osx
    #ports:
    #  - "6379:6379"

  mailcatcher:
    image: sj26/mailcatcher
    restart: always
    ## linux
    networks:
      fabmanager:
        ipv4_address: 172.18.0.6
    ## osx
    #ports:
    #  - "1080:1080"
    #  - "1025:1025"

## linux
networks:
  fabmanager:
    driver: bridge
    ipam:
      config:
        - subnet: 172.18.0.0/16
          gateway: 172.18.0.1


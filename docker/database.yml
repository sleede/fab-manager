# For staging & production environments, copy this file to database.yml
# For development & test environments, you can use this file OR config/database.yml.default

default: &default
  adapter: postgresql
  encoding: unicode
  pool: 25
  username: <%= ENV["POSTGRES_USERNAME"].to_json %>
  password: <%= (ENV["POSTGRES_PASSWORD_FILE"] ? File.read(ENV.fetch("POSTGRES_PASSWORD_FILE")).strip : ENV["POSTGRES_PASSWORD"]).to_json %>
  host: <%= ENV["POSTGRES_HOST"].to_json %>

development:
  <<: *default
  database: <%= ENV.fetch("POSTGRES_DB", "fablab_development").to_json %>

# Warning: The database defined as "test" will be erased and
# re-generated from your development database when you run "rails".
# Do not set this db to the same as development or production.
test:
  <<: *default
  database: <%= ENV.fetch("POSTGRES_TEST_DB", "fablab_test").to_json %>

staging:
  <<: *default
  database: <%= ENV.fetch("POSTGRES_DB", "fablab_staging").to_json %>


production:
  <<: *default
  database: <%= ENV.fetch("POSTGRES_DB", "fablab_production").to_json %>

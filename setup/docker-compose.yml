services:
  fabmanager:
    image: sleede/fab-manager
    environment:
      RAILS_ENV: production
      RACK_ENV: production
      POSTGRES_PASSWORD_FILE: /run/secrets/postgresql-password
      PGSSLMODE: verify-full
      PGSSLROOTCERT: /run/secrets/postgresql-ca.crt
    env_file:
      - ./config/env
    user: USER_ID
    volumes:
      - ./public/packs:/usr/src/app/public/packs
      - ./public/uploads:/usr/src/app/public/uploads
      - ./invoices:/usr/src/app/invoices
      - ./payment_schedules:/usr/src/app/payment_schedules
      - ./exports:/usr/src/app/exports
      - ./imports:/usr/src/app/imports
      - ./supporting_document_files:/usr/src/app/supporting_document_files
      - ./log:/var/log/supervisor
      - ./plugins:/usr/src/app/plugins
      - ./accounting:/usr/src/app/accounting
      - ./config/auth_provider.yml:/usr/src/app/config/auth_provider.yml
      - ./config/postgresql-certificates/ca.crt:/run/secrets/postgresql-ca.crt:ro
      - type: bind
        source: ./config/postgresql-password
        target: /run/secrets/postgresql-password
        read_only: true
        bind:
          create_host_path: false
    depends_on:
      - postgres
      - redis
      - elasticsearch
    restart: always
  postgres:
    # Candidate default: requires the complete migration rehearsal before release.
    image: postgres:18.6-bookworm@sha256:5c4783a8cc3f0074912164f94dfa1be4e043438f0f707cf968d7af9a0d31a2c8
    entrypoint: [bash, /usr/local/bin/fm-postgresql-entrypoint.sh]
    command: [postgres, -c, ssl=on, -c, ssl_cert_file=/certs/server.crt, -c, ssl_key_file=/certs/server.key]
    volumes:
      - type: bind
        source: ./postgresql
        target: /var/lib/postgresql
        bind:
          create_host_path: false
      - ./config/postgresql-entrypoint.sh:/usr/local/bin/fm-postgresql-entrypoint.sh:ro
      - ./config/postgresql-guard:/run/fm-pg-guard
      - ./config/postgresql-certificates/postgres:/certs:ro
      - ./config/postgresql-password:/run/secrets/postgresql-password:ro
    restart: always
    environment:
      PGDATA: /var/lib/postgresql/18/docker
      POSTGRES_PASSWORD_FILE: /run/secrets/postgresql-password
      POSTGRES_INITDB_ARGS: --auth-host=scram-sha-256 --auth-local=scram-sha-256
      FM_PG_INITIALIZE: ${FM_PG_INITIALIZE:-0}
  elasticsearch:
    image: elasticsearch:5.6
    environment:
      - "ES_JAVA_OPTS=-Xms512m -Xmx512m -Dlog4j2.formatMsgNoLookups=true"
    ulimits:
      memlock:
        soft: -1
        hard: -1
    volumes:
      - ./elasticsearch/config:/usr/share/elasticsearch/config
      - ./elasticsearch:/usr/share/elasticsearch/data
    restart: always
  redis:
    image: redis:6-alpine
    volumes:
      - ./redis:/data
    restart: always
  nginx:
    image: nginx:latest
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./config/nginx:/etc/nginx/conf.d
      - ./letsencrypt/etc:/etc/letsencrypt
      - ./log:/var/log/nginx
    volumes_from:
      - fabmanager:ro
    links:
      - fabmanager:fabmanager
    restart: always

# German using the informal address ("du") is a custom language in Crowdin ("German, informal", dialect of German).
# Its Crowdin language code (de-informal) is mapped to the Rails locale code (de-x-informal) for every file below.
# Untranslated strings must NOT be exported for this language (they must be absent from the exported files),
# so that the application falls back to the formal German (de) instead of the English source.
files:
  - source: /config/locales/app.admin.en.yml
    translation: /config/locales/app.admin.%two_letters_code%.yml
    languages_mapping:
      two_letters_code:
        de-informal: de-x-informal
  - source: /config/locales/app.logged.en.yml
    translation: /config/locales/app.logged.%two_letters_code%.yml
    languages_mapping:
      two_letters_code:
        de-informal: de-x-informal
  - source: /config/locales/app.public.en.yml
    translation: /config/locales/app.public.%two_letters_code%.yml
    languages_mapping:
      two_letters_code:
        de-informal: de-x-informal
  - source: /config/locales/app.shared.en.yml
    translation: /config/locales/app.shared.%two_letters_code%.yml
    languages_mapping:
      two_letters_code:
        de-informal: de-x-informal
  - source: /config/locales/en.yml
    translation: /config/locales/%two_letters_code%.yml
    languages_mapping:
      two_letters_code:
        de-informal: de-x-informal
  - source: /config/locales/devise.en.yml
    translation: /config/locales/devise.%two_letters_code%.yml
    languages_mapping:
      two_letters_code:
        de-informal: de-x-informal
  - source: /config/locales/mails.en.yml
    translation: /config/locales/mails.%two_letters_code%.yml
    languages_mapping:
      two_letters_code:
        de-informal: de-x-informal
